[project]
name = "biva-worker"
version = "0.1.0"
description = "BIVA Brain ai-worker: mọi job dùng LLM/NLP (ingest, consolidate, promote, validate, test...)"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "google-genai>=2.26.0",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "opentelemetry-api>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "rfc3339-validator>=0.1.4", # bắt buộc để FormatChecker kiểm tra date-time giống phía Go
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biva_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
