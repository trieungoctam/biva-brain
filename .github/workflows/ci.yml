name: ci

# Push ở mọi nhánh (PR trong repo nhận check từ push); workflow_dispatch để chạy tay.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint + kiểm tra file sinh ra (go.mod/go.sum, uv.lock) không lệch.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: brain-api/go.mod
          cache-dependency-path: brain-api/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: ai-worker
      - name: go mod tidy không làm thay đổi go.mod/go.sum
        working-directory: brain-api
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: uv.lock khớp pyproject.toml
        working-directory: ai-worker
        run: uv lock --check
      - run: make lint

  # Unit + contract test (fixture chung Go ⇄ Python) + test cần Postgres thật
  # (migration up/down/up, queue, scheduler, MCP + auth, runner, index) + Redis (quota LLM).
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: biva
          POSTGRES_PASSWORD: biva
          POSTGRES_DB: biva_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U biva -d biva_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      BIVA_TEST_DATABASE_URL: postgres://biva:biva@localhost:5432/biva_test?sslmode=disable
      BIVA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: brain-api/go.mod
          cache-dependency-path: brain-api/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: ai-worker
      # test-go chạy trước: migrate DB tới bản mới nhất cho test-py.
      - run: make test

  # make up thật trên runner (không GPU): build image, migrate, brain-api, ai-worker, TEI CPU;
  # đi luồng MCP → queue → worker. Thay cho bước build image riêng.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: make smoke
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200
