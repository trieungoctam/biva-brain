# Cấu hình LLM dùng chung cho ai-worker (Python) và brain-api (Go, khi cần).
# Spec: docs/system-architecture.md §3.4 · schema: contracts/schemas/llm_config.schema.json
#
# Thứ tự thử = danh sách model của tier; lỗi tạm thời / 429 / 5xx / timeout / bị chặn / output sai schema /
# hết quota → model kế tiếp.
#
# Model ID: theo SDK google-genai 2.26 (danh sách model trong SDK).
# Giá: USD / 1 triệu token, prompt ≤ 200K token, bậc Standard — GIÁ THAM KHẢO (2026-09), chưa đối chiếu được
# trang chính thức (ai.google.dev/gemini-api/docs/pricing bị chặn từ môi trường build) → kiểm lại trước khi dùng
# số liệu chi phí để báo cáo. Thiếu giá cache → tính bằng giá input (ước lượng cao).
version: 1

providers:
  gemini:
    kind: gemini               # Gemini Developer API qua SDK google-genai
    api_key_env: GEMINI_API_KEY
    base_url_env: GEMINI_BASE_URL
    timeout_s: 120
    max_retries: 1             # SDK tự retry 1 lần; sau đó chuyển model kế tiếp

models:
  gemini-3.5-flash:
    provider: gemini
    thinking_level: low        # trích xuất có cấu trúc: không cần suy luận sâu
    price: {input: 1.50, output: 9.00, cache_read: 0.15}
  gemini-3.1-flash-lite:
    provider: gemini
    price: {input: 0.25, output: 1.50}
  gemini-3.1-pro-preview:
    provider: gemini
    price: {input: 2.00, output: 12.00}
  gemini-2.5-pro:
    provider: gemini           # bản GA: dự phòng khi bản preview lỗi / bị rút
    price: {input: 1.25, output: 10.00}

tiers:
  small: [gemini-3.5-flash, gemini-3.1-flash-lite]     # ingest, consolidate, eval
  strong: [gemini-3.1-pro-preview, gemini-2.5-pro]     # validate LLM, reflect, reference executor

purposes:
  ingest:      {tier: small,  tokens_per_minute: 400000, requests_per_minute: 120}
  knowledge:   {tier: small,  tokens_per_minute: 400000, requests_per_minute: 120}
  logic:       {tier: small,  tokens_per_minute: 400000, requests_per_minute: 120}   # extract_logic_spec
  validate:    {tier: strong, tokens_per_minute: 200000, requests_per_minute: 60}
  test:        {tier: strong, tokens_per_minute: 200000, requests_per_minute: 60}
  interactive: {tier: strong, tokens_per_minute: 200000, requests_per_minute: 60}
